<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Contact & Location</title>
<style>
body {
  background: linear-gradient(135deg, #0f172a, #020617);
  font-family: sans-serif;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  direction: rtl;
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(18px);
  padding: 32px;
  border-radius: 22px;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.15);
  max-width: 380px;
  text-align: center;
}

.info {
  margin-top: 12px;
  font-size: 16px;
  line-height: 1.9;
}

a {
  color: #8ab4ff;
  text-decoration: none;
}
</style>
</head>

<body>
<div class="card">
  <h2>📍 اطلاعات تماس</h2>

  <div class="info">
    <div>📞 شماره موبایل: <b>09166336409</b></div>
    <div>🗺 موقعیت مکانی:</div>
    <a href="https://maps.app.goo.gl/fu8bjK1zeW3jBmwL9" target="_blank">
      مشاهده در Google Maps
    </a>
  </div>

</div>
</body>
</html>
