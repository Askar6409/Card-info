<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بانک رفاه - اطلاعات حساب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #e63946;
            --secondary-color: #a8dadc;
            --dark-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --text-light: #f1faee;
            --text-muted: #94a3b8;
            --border-radius: 20px;
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg), #1e293b);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        
        .card-container {
            width: 100%;
            max-width: 420px;
            perspective: 1000px;
        }
        
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }
        
        .bank-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .bank-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .bank-icon {
            background: var(--primary-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .bank-name {
            font-size: 24px;
            font-weight: 700;
        }
        
        .chip {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            width: 40px;
            height: 30px;
            border-radius: 5px;
            position: relative;
        }
        
        .chip::after {
            content: '';
            position: absolute;
            top: 5px;
            right: 5px;
            bottom: 5px;
            left: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        
        .card-number-container {
            margin-bottom: 25px;
        }
        
        .card-number-label {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        
        .card-number {
            font-family: 'Courier New', monospace;
            font-size: 22px;
            letter-spacing: 3px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.1);
            direction: ltr;
            text-align: center;
        }
        
        .card-number span {
            display: inline-block;
            width: 70px;
        }
        
        .info-section {
            margin-bottom: 20px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
        }
        
        .info-value {
            font-weight: 600;
            font-size: 16px;
            text-align: left;
            direction: ltr;
            font-family: 'Courier New', monospace;
        }
        
        .iban-container {
            margin: 25px 0;
        }
        
        .iban-value {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            letter-spacing: 1px;
            word-break: break-all;
            direction: ltr;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-copy {
            background: var(--primary-color);
            color: white;
        }
        
        .btn-copy:hover {
            background: #d32f2f;
        }
        
        .btn-share {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
        }
        
        .btn-share:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary-color);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(-10px);
            transition: var(--transition);
            z-index: 100;
        }
        
        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
            
            .card-number {
                font-size: 18px;
                letter-spacing: 2px;
            }
            
            .card-number span {
                width: 60px;
            }
            
            .bank-name {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="bank-header">
                <div class="bank-logo">
                    <div class="bank-icon">
                        <i class="fas fa-university"></i>
                    </div>
                    <div class="bank-name">بانک رفاه</div>
                </div>
                <div class="chip"></div>
            </div>
            
            <div class="card-number-container">
                <div class="card-number-label">شماره کارت بانکی</div>
                <div class="card-number" id="cardNumber">
                    <span>6274</span>
                    <span>6311</span>
                    <span>6071</span>
                    <span>7518</span>
                </div>
            </div>
            
            <div class="info-section">
                <div class="info-item">
                    <div class="info-label">
                        <i class="fas fa-user"></i>
                        <span>نام صاحب حساب</span>
                    </div>
                    <div class="info-value">عباس عساکره</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">
                        <i class="fas fa-calendar-alt"></i>
                        <span>تاریخ انقضا</span>
                    </div>
                    <div class="info-value">07/30</div>
                </div>
                
                <div class="info-item">
                    <div class="info-label">
                        <i class="fas fa-credit-card"></i>
                        <span>نوع کارت</span>
                    </div>
                    <div class="info-value">Debit</div>
                </div>
            </div>
            
            <div class="iban-container">
                <div class="card-number-label">شماره شبا</div>
                <div class="iban-value" id="ibanValue">IR57013010000000320909062</div>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-copy" id="copyCardBtn">
                    <i class="far fa-copy"></i>
                    کپی شماره کارت
                </button>
                <button class="btn btn-share" id="shareBtn">
                    <i class="fas fa-share-alt"></i>
                    اشتراک‌گذاری
                </button>
            </div>
            
            <div class="footer">
                <p>تراشکاری عساکره</p>
                <p style="margin-top: 5px; font-size: 12px;">
                    <i class="fas fa-shield-alt"></i>
                    اطلاعات امنیتی محافظت شده
                </p>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">متن کپی شد!</div>

    <script>
        // عناصر DOM
        const cardNumber = document.getElementById('cardNumber');
        const ibanValue = document.getElementById('ibanValue');
        const copyCardBtn = document.getElementById('copyCardBtn');
        const shareBtn = document.getElementById('shareBtn');
        const notification = document.getElementById('notification');
        
        // شماره کارت بدون فاصله
        const cardNumberText = '6274631160717518';
        const ibanText = 'IR57013010000000320909062';
        
        // کپی شماره کارت
        copyCardBtn.addEventListener('click', function() {
            navigator.clipboard.writeText(cardNumberText)
                .then(() => {
                    showNotification('شماره کارت کپی شد!');
                })
                .catch(err => {
                    console.error('خطا در کپی: ', err);
                    showNotification('خطا در کپی کردن');
                });
        });
        
        // کپی شماره شبا
        ibanValue.addEventListener('click', function() {
            navigator.clipboard.writeText(ibanText)
                .then(() => {
                    showNotification('شماره شبا کپی شد!');
                })
                .catch(err => {
                    console.error('خطا در کپی: ', err);
                    showNotification('خطا در کپی کردن');
                });
        });
        
        // اشتراک‌گذاری
        shareBtn.addEventListener('click', function() {
            const shareData = {
                title: 'اطلاعات حساب بانک رفاه',
                text: `بانک رفاه - نام: عباس عساکره - شماره کارت: ${cardNumberText}`,
                url: window.location.href
            };
            
            if (navigator.share) {
                navigator.share(shareData)
                    .then(() => console.log('اشتراک‌گذاری موفق'))
                    .catch(err => console.error('خطا در اشتراک‌گذاری: ', err));
            } else {
                // برای مرورگرهایی که از Web Share API پشتیبانی نمی‌کنند
                navigator.clipboard.writeText(shareData.text)
                    .then(() => {
                        showNotification('اطلاعات برای اشتراک‌گذاری کپی شد');
                    })
                    .catch(err => {
                        console.error('خطا در کپی: ', err);
                        showNotification('خطا در کپی کردن');
                    });
            }
        });
        
        // نمایش نوتیفیکیشن
        function showNotification(message) {
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // افکت hover روی کارت
        const card = document.querySelector('.card');
        card.addEventListener('mousemove', function(e) {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateY = (x - centerX) / 25;
            const rotateX = (centerY - y) / 25;
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px)`;
        });
        
        card.addEventListener('mouseleave', function() {
            card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateY(0)';
        });
    </script>
</body>
</html>
